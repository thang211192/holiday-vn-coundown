<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đếm Ngược Ngày Lễ Việt Nam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating particles background -->
  <div class="particles" id="particles"></div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">🇻🇳</div>
      <h1 class="title">Ngày Lễ Việt Nam</h1>
      <p class="subtitle">Đếm ngược đến những ngày đặc biệt</p>
    </div>
  </header>

  <!-- Next upcoming holiday hero -->
  <section class="hero" id="hero">
    <div class="hero-label">Sắp tới</div>
    <div class="hero-icon" id="hero-icon">🎉</div>
    <h2 class="hero-name" id="hero-name">Đang tải...</h2>
    <p class="hero-desc" id="hero-desc"></p>
    <div class="hero-date-display" id="hero-date-display"></div>
    <div class="countdown-boxes" id="hero-countdown">
      <div class="countdown-box">
        <span class="count" id="cd-days">--</span>
        <span class="label">Ngày</span>
      </div>
      <div class="sep">:</div>
      <div class="countdown-box">
        <span class="count" id="cd-hours">--</span>
        <span class="label">Giờ</span>
      </div>
      <div class="sep">:</div>
      <div class="countdown-box">
        <span class="count" id="cd-mins">--</span>
        <span class="label">Phút</span>
      </div>
      <div class="sep">:</div>
      <div class="countdown-box">
        <span class="count" id="cd-secs">--</span>
        <span class="label">Giây</span>
      </div>
    </div>
  </section>

  <!-- All holidays grid -->
  <section class="all-section">
    <h2 class="section-title">Tất cả ngày lễ</h2>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="footer">
    <p>Làm bằng ❤️ cho người Việt Nam</p>
  </footer>

  <!-- Inline holiday data: copy từ holidays.json vào đây để tránh lỗi CORS khi mở file:// -->
  <script id="holidays-data" type="application/json">
[
  { "name": "Tết Dương Lịch",           "date": "01-01", "description": "Ngày đầu năm mới theo lịch dương, mở đầu cho một năm mới tràn đầy hy vọng.",                                                                       "icon": "🎆", "color": "#FF6B6B" },
  { "name": "Tết Nguyên Đán",           "date": "29-01", "description": "Tết cổ truyền lớn nhất của dân tộc Việt Nam, là dịp để sum họp gia đình và đón chào năm mới âm lịch.",                                            "icon": "🧧", "color": "#FF4500" },
  { "name": "Ngày Valentine",           "date": "14-02", "description": "Ngày lễ tình nhân, dịp để bày tỏ tình yêu thương với người thân yêu.",                                                                             "icon": "❤️", "color": "#FF1493" },
  { "name": "Ngày Quốc Tế Phụ Nữ",     "date": "08-03", "description": "Ngày Quốc tế Phụ nữ, tôn vinh và ghi nhận những đóng góp to lớn của phụ nữ trên toàn thế giới.",                                                 "icon": "💐", "color": "#9B59B6" },
  { "name": "Giỗ Tổ Hùng Vương",       "date": "26-04", "description": "Ngày tưởng nhớ các Vua Hùng đã có công dựng nước, là ngày giỗ tổ của toàn dân tộc Việt Nam.",                                                     "icon": "🏯", "color": "#8B4513" },
  { "name": "Ngày Giải Phóng Miền Nam", "date": "30-04", "description": "Kỷ niệm ngày thống nhất đất nước 30/04/1975, một trong những ngày lịch sử vĩ đại nhất của dân tộc.",                                              "icon": "🇻🇳", "color": "#DC143C" },
  { "name": "Ngày Quốc Tế Lao Động",   "date": "01-05", "description": "Ngày quốc tế lao động, tôn vinh những người lao động trên toàn thế giới.",                                                                         "icon": "⚒️", "color": "#FF8C00" },
  { "name": "Ngày Quốc Khánh",         "date": "02-09", "description": "Kỷ niệm ngày Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập tại Quảng trường Ba Đình ngày 02/09/1945.",                                             "icon": "⭐", "color": "#FFD700" },
  { "name": "Tết Trung Thu",           "date": "06-10", "description": "Ngày Rằm tháng 8 âm lịch, ngày tết thiếu nhi với đèn lồng, bánh trung thu và múa lân.",                                                           "icon": "🌕", "color": "#FF8C00" },
  { "name": "Ngày Phụ Nữ Việt Nam",    "date": "20-10", "description": "Ngày tôn vinh những người phụ nữ Việt Nam anh hùng, bất khuất, trung hậu, đảm đang.",                                                             "icon": "🌸", "color": "#FF69B4" },
  { "name": "Ngày Nhà Giáo Việt Nam",  "date": "20-11", "description": "Ngày tôn vinh những người thầy, người cô đã cống hiến cho sự nghiệp giáo dục của đất nước.",                                                      "icon": "📚", "color": "#4169E1" },
  { "name": "Giáng Sinh",              "date": "25-12", "description": "Lễ Giáng Sinh, ngày lễ của tình yêu thương, gia đình và sự sẻ chia ấm áp.",                                                                        "icon": "🎄", "color": "#228B22" }
]
  </script>
  <script src="app.js"></script>
</body>
</html>
